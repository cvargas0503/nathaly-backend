name: API checks
on:
  push:
    branches: [develop, qa, master, 'feature/**', 'bugfix/**', 'hotfix/**']
  pull_request:
    branches: [develop, qa, master, main]
permissions:
  contents: read
jobs:
  branch-policy:
    name: Validate branch flow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node .github/scripts/check-branch-flow.cjs --self-test
      - if: github.event_name == 'pull_request'
        run: node .github/scripts/check-branch-flow.cjs
        env:
          PR_BASE: ${{ github.base_ref }}
          PR_HEAD: ${{ github.head_ref }}
  build:
    name: Validate API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
      - run: npm run typecheck
      - run: npm test
